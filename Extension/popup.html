<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FormTaxi</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="icons/formtaxi-logo.png" alt="FormTaxi">
      </header>

      <section id="split-actions" class="split-actions" hidden>
        <button id="copy-backward" class="split-button" type="button">
          <strong id="backward-arrow" aria-hidden="true">←</strong>
          <small id="backward-action">Copy from other tab</small>
        </button>
        <button id="copy-forward" class="split-button" type="button">
          <strong id="forward-arrow" aria-hidden="true">→</strong>
          <small id="forward-action">Copy to other tab</small>
        </button>
      </section>

      <section class="actions" aria-label="Form clipboard actions">
        <button id="copy" class="button button-primary" type="button">
          <svg class="action-icon" aria-hidden="true" viewBox="0 0 32 32">
            <rect x="10" y="5" width="16" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <path d="M7 10H6a2 2 0 0 0-2 2v13a3 3 0 0 0 3 3h12a2 2 0 0 0 2-2v-1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span class="button-label">Copy Values</span>
        </button>
        <button id="paste" class="button button-secondary" type="button" disabled>
          <svg class="action-icon" aria-hidden="true" viewBox="0 0 32 32">
            <path d="M11 8V6h10v2h3a3 3 0 0 1 3 3v16H5V11a3 3 0 0 1 3-3Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
            <rect x="10" y="4" width="12" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <path d="M10 17h12M10 22h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span class="button-label">Paste Values</span>
        </button>
      </section>

      <section id="clipboard" class="clipboard empty" aria-live="polite">
        <div>
          <strong id="clipboard-title">Nothing copied yet</strong>
          <span id="clipboard-detail">Copy values from any web form.</span>
        </div>
        <button id="clear" class="clear" type="button" hidden aria-label="Clear copied values">Clear</button>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
